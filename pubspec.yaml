name: keychain_shop
description: "Keychain Online Shopping & Home-to-Home Delivery — Flutter + Firebase FYP."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_messaging: ^16.6.0
  cloud_functions: ^6.4.0
  provider: ^6.1.5+1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# firebase_core_web 3.11.0 uses Object.isA (Dart 3.12+); Flutter 3.41 ships Dart 3.11.
# Remove when Flutter is upgraded to 3.44+ or firebase_core_web publishes the #18612 fix.
dependency_overrides:
  firebase_core_web: 3.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
